# @dsh-xhl/workspace-groups bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the official CLI —
#
#   dsh plugin --profile <name> add @dsh-xhl/workspace-groups
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `@dsh-xhl/workspace-groups` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like a manual cordis.patch.yml mount line.
#
# The row uses a stable `id` (configuration-tree line identity), a `name` the
# host Loader resolves as a package, and a `config` the host half consumes.
- insert:
    - id: workspace-groups
      name: '@dsh-xhl/workspace-groups'
      config: {}
